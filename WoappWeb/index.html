<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexCoach</title>
    
    <!-- Meta tags per PWA Standalone (Nasconde la barra degli indirizzi) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FlexCoach" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#030712" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#030712" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <script>
      (function() {
        try {
          var isLight = localStorage.getItem('userTheme') === 'light';
          var navColor = isLight ? '#ffffff' : '#030712';
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          metas.forEach(function(m) { m.setAttribute('content', navColor); });
        } catch (e) {}
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
